{% extends 'layout.html' %}

{% block content %}
<div class="container">
    {% if title %}
        <h1>{{ title }} Page</h1>
    {% endif %}

    <span>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('get_posts') }}">Posts</a>
    </span>

    <article>
        <div>
            <h3>{{ post.title }}</h3>
            <img src="{{ url_for('assets', path='images/stephen_chow.jpg') }}" alt="">
            <small>{{ post.author }}</small>
            <p>{{ post.content }}</p>
            <small>{{ post.date_posted }}</small>
        </div>
        <span>
            <button>Edit post</button>
            <button>Delete Post</button>
        </span>
    </article>
</div>
{% endblock content %}
