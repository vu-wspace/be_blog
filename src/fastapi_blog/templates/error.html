{% extends 'layout.html' %}

{% block content %}
<div class="container">
    {% if title %}
        <h1>{{ title }} Page</h1>
    {% endif %}

    <span>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('get_posts') }}">Posts</a>
    </span>

    <article>
        <h1>
            <a href="#">Oops... {{ status_code }} Error</a>
        </h1>
        <p>{{ message }}</p>
    </article>
</div>
{% endblock content %}
